# Copy to /etc/piusi-logger/config.ini and chmod 600 (it holds the DB
# password). The real file contains site-specific details -- never commit it.

[bowser]
host = 192.168.1.101
port = 12345
unit_address = 123456

[service]
# Seconds between polling cycles. Each cycle connects, drains every queued
# record, and disconnects, leaving the bridge free in between.
poll_interval = 60
# Raw wire log (every byte, fsync'd) and the spool of decoded records not yet
# in MySQL. Both contain real customer data.
log_dir = /var/lib/piusi-logger/raw
spool_dir = /var/lib/piusi-logger/spool

[mysql]
host = localhost
port = 3306
user = piusi
password = change-me
database = piusi
table = fuel_uplifts
